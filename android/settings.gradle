// Settings del proyecto Mis Millas Flex (app Android)
// Repositorios de donde Gradle descarga el plugin de Android.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "MisMillasFlex"
include ':app'
