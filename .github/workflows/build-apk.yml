# Construye el APK de Mis Millas Flex en GitHub (gratis, repositorio público).
# Se ejecuta al cambiar cualquier archivo de android/ o este mismo archivo,
# y también se puede lanzar a mano desde la pestaña Actions.
# Además de guardarlo como artefacto, publica el APK en un Release (v1.0)
# para poder descargarlo con un enlace directo, sin entrar a Actions.
name: Build APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Apuntar al SDK de Android del runner
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Construir el APK de depuración
        run: gradle :app:assembleDebug --no-daemon
        working-directory: android

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: millas-flex-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar el APK como release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: Mis Millas Flex v1.0
          files: android/app/build/outputs/apk/debug/app-debug.apk
